<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Premarket"/>
<meta name="theme-color" content="#080c18"/>
<title>Premarket Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#060810;color:#e5e7eb;min-height:100vh;padding-bottom:calc(env(safe-area-inset-bottom) + 60px)}
button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.hdr{background:linear-gradient(180deg,#0d1428 0%,#080c18 100%);padding:calc(env(safe-area-inset-top) + 12px) 0 0;border-bottom:1px solid #1a2540;position:sticky;top:0;z-index:100}
.hdr-row{display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.title{font-size:22px;font-weight:700;letter-spacing:-.04em;color:#fff}
.sub{font-size:11px;color:#4b5675;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:5px;background:#0d1420;border:1px solid #1a2540;border-radius:8px;padding:5px 10px;font-size:11px;color:#6b7280}
.dot{width:6px;height:6px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
.rbtn{background:#1e2d4a;border:1px solid #2d4470;color:#8fb0ee;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;min-height:36px}
.rbtn .ico{display:inline-block}
.rbtn.spinning .ico{animation:spin 1s linear infinite}
.pm-banner{background:#0a1a0a;border:1px solid #1a3a1a;border-radius:10px;padding:8px 12px;margin:8px 16px 0;font-size:11px;color:#4ade80;display:flex;align-items:center;gap:6px}
.pm-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1s infinite;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 0}
.stat{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:8px 4px;text-align:center}
.stat-v{font-size:17px;font-weight:700;color:#fff}
.stat-l{font-size:9px;color:#5b6688;margin-top:1px;text-transform:uppercase}
/* TABS — horizontal scroll, sticky inside header */
.tabs{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 12px;min-height:36px;border-radius:10px;font-size:12px;font-weight:600;border:1px solid #1a2540;cursor:pointer;background:#0d1420;color:#7280a0;white-space:nowrap;scroll-snap-align:start}
.tab.on{background:#3730a3;color:#fff;border-color:#4338ca}
.tab.bot{border-color:#14532d;color:#4ade80}
.tab.bot.on{background:#15803d;border-color:#16a34a;color:#fff}
.tabpane{animation:fadein .15s ease}
.fbar{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.fbar::-webkit-scrollbar{display:none}
.fp{padding:6px 12px;min-height:32px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid #1a2540;background:#0d1420;color:#7280a0}
.fp.on{background:#3730a3;color:#fff;border-color:#4338ca}
.content{padding:8px 16px 0;max-width:760px;margin:0 auto}
.fbar,.stats{max-width:760px;margin-left:auto;margin-right:auto}
.sect{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.note{font-size:11px;color:#5b6688;margin:6px 0 8px;line-height:1.5}
.foot{font-size:10px;color:#5b6688;text-align:center;margin:10px 0;line-height:1.6}
/* CARDS */
.card{background:#0d1420;border:1px solid #1a2540;border-radius:12px;margin-bottom:8px;overflow:hidden}
.card.open{border-color:#4338ca}
.pad{padding:12px}
.ch{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:60px}
.ring{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:800}
.rh{background:rgba(16,185,129,.12);border:2px solid #10b981;color:#10b981}
.rm{background:rgba(99,102,241,.12);border:2px solid #6366f1;color:#818cf8}
.rl{background:rgba(245,158,11,.12);border:2px solid #f59e0b;color:#f59e0b}
.rs{background:rgba(239,68,68,.08);border:2px solid #ef4444;color:#ef4444}
.ci{flex:1;min-width:0}
.tk{font-size:15px;font-weight:700;color:#fff}
.nm{font-size:11px;color:#5b6688;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin-top:2px;display:inline-block}
.pgo{background:rgba(16,185,129,.15);color:#10b981}
.psw{background:rgba(99,102,241,.15);color:#818cf8}
.pfd{background:rgba(251,146,60,.15);color:#fb923c}
.pwt{background:rgba(245,158,11,.15);color:#f59e0b}
.psk{background:rgba(239,68,68,.1);color:#ef4444}
.cr2{text-align:right;flex-shrink:0}
.cc{font-size:15px;font-weight:700}
.up{color:#10b981}.dn{color:#ef4444}
.cp{font-size:11px;color:#6b7280;margin-top:1px}
.det{padding:12px;border-top:1px solid #1a2540;animation:slidein .2s ease}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.dg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.dc{background:#060810;border:1px solid #1a2540;border-radius:8px;padding:8px}
.dl{font-size:10px;color:#5b6688;margin-bottom:2px}
.dv{font-size:13px;font-weight:600;color:#fff}
.sigrow{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cg{color:#10b981}.dg2{background:#10b981}
.cy{color:#f59e0b}.dy2{background:#f59e0b}
.cr3{color:#ef4444}.dr2{background:#ef4444}
.sb{background:rgba(67,56,202,.15);border:1px solid rgba(67,56,202,.3);border-radius:8px;padding:9px;margin-top:8px}
.slb{font-size:10px;color:#818cf8;font-weight:700;margin-bottom:3px}
.st{font-size:12px;color:#c7d2fe;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 12px;min-height:40px;background:#3730a3;border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.btn.full{width:100%;margin-top:8px}
.btn.g{background:#15803d}.btn.r{background:#7f1d1d}.btn.ghost{background:#111a2e;border:1px solid #24345a;color:#9db4e8}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;border-radius:8px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btnrow .btn{flex:1}
.iv-bar{height:6px;border-radius:3px;background:#1a2540;margin:4px 0 2px;overflow:hidden}
.iv-fill{height:100%;border-radius:3px;transition:width .5s}
.iv-low{background:linear-gradient(90deg,#10b981,#34d399)}
.iv-mid{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.iv-high{background:linear-gradient(90deg,#ef4444,#f87171)}
.res-box{background:#1a0a0a;border:1px solid #3d1010;border-radius:8px;padding:8px;margin-top:8px}
.sup-box{background:#0a1a0a;border:1px solid #103d10;border-radius:8px;padding:8px;margin-top:6px}
.lvl-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lvl-row:last-child{border:none}
.sbar{margin:8px 16px 0;border-radius:8px;padding:7px 11px;font-size:11px}
.slv{background:#0d1a10;border:1px solid #1a3a20;color:#4ade80}
.scl{background:#1a1200;border:1px solid #3d2e00;color:#f59e0b}
.ser{background:#1a0a0a;border:1px solid #3d1010;color:#f87171}
.ld{text-align:center;padding:40px 20px}
.sp{width:28px;height:28px;border:3px solid #1a2540;border-top-color:#4f46e5;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
.es{text-align:center;padding:36px 20px;color:#5b6688}
.ei{font-size:32px;margin-bottom:8px}
.et{font-size:14px;font-weight:600;color:#9ca3af;margin-bottom:5px}
.em{font-size:12px;line-height:1.8}
.opt-hdr{background:#0d1a10;border:1px solid #1a3a20;border-radius:10px;padding:12px;margin-bottom:8px}
.opt-rec{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:12px;margin-bottom:8px}
.tf-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;display:inline-block;margin-bottom:7px}
.tf0{background:rgba(239,68,68,.2);color:#f87171}
.tfw{background:rgba(245,158,11,.2);color:#fbbf24}
.tfm{background:rgba(99,102,241,.2);color:#818cf8}
.tfs{background:rgba(16,185,129,.2);color:#4ade80}
.chip{font-size:11px;background:rgba(255,255,255,.05);border-radius:5px;padding:2px 7px;color:#9ca3af;display:inline-block}
.chip.g{background:rgba(16,185,129,.1);color:#10b981}.chip.y{background:rgba(245,158,11,.1);color:#f59e0b}.chip.r{background:rgba(239,68,68,.1);color:#f87171}.chip.b{background:rgba(99,102,241,.12);color:#818cf8}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.calc-box{background:#0d1420;border:1px solid #1a2540;border-radius:12px;padding:14px;margin-bottom:8px}
.calc-input,.inp{width:100%;background:#060810;border:1px solid #1a2540;border-radius:8px;color:#fff;padding:10px 11px;font-size:16px;margin-bottom:8px;outline:none}
.calc-input:focus,.inp:focus{border-color:#4338ca}
.lbl{font-size:11px;color:#5b6688;display:block;margin-bottom:3px}
.calc-result{background:#0a1428;border:1px solid #1e3055;border-radius:10px;padding:12px;margin-top:10px}
.calc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calc-row:last-child{margin:0}
.earn-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.earn-card.urgent{border-color:#ef4444;background:#1a0808}
.earn-card.soon{border-color:#f59e0b;background:#1a1200}
.earn-date{text-align:center;min-width:40px}
.earn-day{font-size:18px;font-weight:800;color:#fff}
.earn-mon{font-size:10px;color:#5b6688;margin-top:1px}
.news-card,.flow-card,.pol-card{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.ns-bull{background:rgba(16,185,129,.15);color:#10b981}
.ns-bear{background:rgba(239,68,68,.15);color:#ef4444}
.ns-neut{background:rgba(107,114,128,.15);color:#9ca3af}
.flow-call{border-left:3px solid #10b981}
.flow-put{border-left:3px solid #ef4444}
.ptb-buy{background:rgba(16,185,129,.15);color:#10b981}
.ptb-sell{background:rgba(239,68,68,.15);color:#ef4444}
.wli{background:#0d1420;border:1px solid #1a2540;border-radius:10px;padding:11px;margin-bottom:7px}
.plan-card{background:#0d1a10;border:1px solid #1a3a20;border-radius:12px;margin-bottom:8px;padding:12px}
.idea{background:rgba(67,56,202,.15);border:1px solid rgba(67,56,202,.3);border-radius:7px;padding:8px;margin-top:7px;font-size:11px;color:#c7d2fe;line-height:1.5}
.warn{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:8px;margin:6px 0;font-size:11px;color:#fbbf24;line-height:1.5}
.bad{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px;margin:6px 0;font-size:11px;color:#f87171;line-height:1.5}
/* BOT */
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
@media(min-width:520px){.kpi{grid-template-columns:repeat(4,1fr)}}
.kpi .dc{text-align:center}
.kpi .dv{font-size:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:10px;color:#5b6688;text-align:left;font-weight:600;padding:5px 4px;border-bottom:1px solid #1a2540;text-transform:uppercase}
.tbl td{padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.04);color:#d1d5db}
.tbl td.n,.tbl th.n{text-align:right}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,.04)}
.chk:last-child{border:none}
.chk .ok{color:#10b981;font-weight:800;width:16px}.chk .no{color:#ef4444;font-weight:800;width:16px}
.prog{height:5px;background:#1a2540;border-radius:3px;overflow:hidden;flex:1;max-width:90px}
.prog>div{height:100%;background:#4f46e5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04)}
.sw{position:relative;width:44px;height:26px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#1a2540;border-radius:13px;transition:.2s;cursor:pointer}
.sw span:before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+span{background:#16a34a}
.sw input:checked+span:before{transform:translateX(18px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#0d1420;border:1px solid #24345a;border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);animation:slidein .2s ease}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:16px}}
pre.code{background:#060810;border:1px solid #1a2540;border-radius:8px;padding:10px;font-size:11px;color:#c7d2fe;white-space:pre-wrap;word-break:break-all;margin:4px 0 8px;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:#15803d;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;display:none}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div>
      <div class="title">Premarket Pro</div>
      <div class="sub" id="mktStatus">Options Intelligence</div>
    </div>
    <div style="text-align:right">
      <span class="badge"><span class="dot"></span><span id="clk">--:--</span> ET</span><br>
      <button class="rbtn" id="rb" onclick="go()"><span class="ico">↻</span> Refresh</button>
    </div>
  </div>
  <div class="tabs" id="tabbar">
    <button class="tab on" data-tab="today" onclick="sw('today')">🎯 Today</button>
    <button class="tab bot" data-tab="bot" onclick="sw('bot')">🤖 Bot</button>
    <button class="tab" data-tab="movers" onclick="sw('movers')">🔥 Movers</button>
    <button class="tab" data-tab="strikes" onclick="sw('strikes')">⚡ Strikes</button>
    <button class="tab" data-tab="swings" onclick="sw('swings')">📈 Swings</button>
    <button class="tab" data-tab="plan" onclick="sw('plan')">📋 Plan</button>
    <button class="tab" data-tab="holdings" onclick="sw('holdings')">💼 Holdings</button>
    <button class="tab" data-tab="calc" onclick="sw('calc')">🧮 P&amp;L</button>
    <button class="tab" data-tab="earn" onclick="sw('earn')">📅 Earn</button>
    <button class="tab" data-tab="econ" onclick="sw('econ')">🌐 Macro</button>
    <button class="tab" data-tab="news" onclick="sw('news')">📰 News</button>
    <button class="tab" data-tab="flow" onclick="sw('flow')">💰 Flow</button>
    <button class="tab" data-tab="comm" onclick="sw('comm')">👥 Crowd</button>
    <button class="tab" data-tab="pols" onclick="sw('pols')">🏛 Pol</button>
    <button class="tab" data-tab="wl" onclick="sw('wl')">👁 List</button>
  </div>
</div>

<div id="pmBanner" class="pm-banner" style="display:none">
  <span class="pm-dot"></span><span id="pmMsg">Premarket active</span>
</div>
<div id="sb" class="sbar scl" style="display:none"></div>

<div class="stats">
  <div class="stat"><div class="stat-v" id="sT">--</div><div class="stat-l">Tickers</div></div>
  <div class="stat"><div class="stat-v" id="sH" style="color:#10b981">--</div><div class="stat-l">Hot</div></div>
  <div class="stat"><div class="stat-v" id="sVix" style="color:#f59e0b">--</div><div class="stat-l">VIX</div></div>
  <div class="stat"><div class="stat-v" id="sBot" style="color:#4ade80">--</div><div class="stat-l">Paper P&amp;L</div></div>
</div>

<div id="t-today" class="tabpane"><div class="content" id="tdc"></div></div>

<div id="t-bot" class="tabpane" style="display:none"><div class="content" id="botc"></div></div>

<div id="t-movers" class="tabpane" style="display:none">
  <div class="fbar">
    <button class="fp on" onclick="sf('all',this)">All</button>
    <button class="fp" onclick="sf('go',this)">🚀 Gap Go</button>
    <button class="fp" onclick="sf('sw2',this)">📅 Swing</button>
    <button class="fp" onclick="sf('fd',this)">🔴 Puts</button>
    <button class="fp" onclick="sf('wt',this)">👀 Watch</button>
  </div>
  <div class="content" id="mc"><div class="ld"><div class="sp"></div><div style="font-size:13px;color:#5b6688">Loading market data...</div></div></div>
</div>

<div id="t-strikes" class="tabpane" style="display:none">
  <div class="content" id="stc">
    <div class="es"><div class="ei">⚡</div><div class="et">Strike Recommender</div><div class="em">Expand any stock in Movers<br>and tap Get Strike Recommendations</div></div>
  </div>
</div>

<div id="t-swings" class="tabpane" style="display:none">
  <div class="fbar">
    <button class="fp on" onclick="filterSwings('all',this)">All</button>
    <button class="fp" onclick="filterSwings('90d',this)">90 Day</button>
    <button class="fp" onclick="filterSwings('leaps',this)">LEAPS</button>
    <button class="fp" onclick="filterSwings('calls',this)">🟢 Calls</button>
    <button class="fp" onclick="filterSwings('puts',this)">🔴 Puts</button>
  </div>
  <div class="content" id="swc"></div>
</div>

<div id="t-plan" class="tabpane" style="display:none"><div class="content" id="pc"></div></div>
<div id="t-holdings" class="tabpane" style="display:none"><div class="content" id="hc"></div></div>

<div id="t-calc" class="tabpane" style="display:none">
  <div class="content">
    <div class="note">Options P&amp;L calculator — know your target before you enter</div>
    <div class="calc-box">
      <label class="lbl">Stock Ticker</label>
      <input class="calc-input" id="cTicker" placeholder="e.g. NVDA" autocapitalize="characters" oninput="autoFillCalc()"/>
      <label class="lbl">Current Stock Price ($)</label>
      <input class="calc-input" id="cStock" type="number" inputmode="decimal" placeholder="e.g. 221.00" oninput="calcPL()"/>
      <label class="lbl">Strike Price ($)</label>
      <input class="calc-input" id="cStrike" type="number" inputmode="decimal" placeholder="e.g. 230" oninput="calcPL()"/>
      <label class="lbl">Premium Paid ($ per share)</label>
      <input class="calc-input" id="cPrem" type="number" inputmode="decimal" placeholder="e.g. 2.50" oninput="calcPL()"/>
      <label class="lbl">Number of Contracts</label>
      <input class="calc-input" id="cContracts" type="number" inputmode="numeric" value="1" oninput="calcPL()"/>
      <label class="lbl">Days to Expiry (DTE)</label>
      <input class="calc-input" id="cDTE" type="number" inputmode="numeric" placeholder="e.g. 14" oninput="calcPL()"/>
      <div id="calcResult"></div>
    </div>
  </div>
</div>

<div id="t-earn" class="tabpane" style="display:none"><div class="content" id="earnc"></div></div>
<div id="t-econ" class="tabpane" style="display:none"><div class="content" id="econc"></div></div>

<div id="t-news" class="tabpane" style="display:none">
  <div class="fbar">
    <button class="fp on" onclick="filterNews('all',this)">All</button>
    <button class="fp" onclick="filterNews('bull',this)">🟢 Bullish</button>
    <button class="fp" onclick="filterNews('bear',this)">🔴 Bearish</button>

// ── NETWORK: direct, then CORS proxies; remembers what worked ────
var ROUTE=lsGet('pp_route',0);
function routes(url){return[url,'https://corsproxy.io/?'+encodeURIComponent(url),'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]}
function tmo(ms){try{return AbortSignal.timeout(ms)}catch(e){var c=new AbortController();setTimeout(function(){c.abort()},ms);return c.signal}}
async function fetchText(url,timeout){
  var rs=routes(url),order=[ROUTE].concat([0,1,2].filter(function(i){return i!==ROUTE}));
  for(var k=0;k<order.length;k++){
    try{
      var r=await fetch(rs[order[k]],{signal:tmo(timeout||8000)});
      if(!r.ok) continue;
      var txt=await r.text();
      if(!txt) continue;
      if(order[k]!==ROUTE){ROUTE=order[k];lsSet('pp_route',ROUTE)}
      return txt;
    }catch(e){continue}
  }
  return null;
}
async function fetchJSON(url,timeout){
  var t=await fetchText(url,timeout);

}
// run fn over items with limited concurrency
async function pool(items,n,fn){
  var i=0;
  async function worker(){while(i<items.length){var idx=i++;try{await fn(items[idx],idx)}catch(e){}}}
  var ws=[];for(var k=0;k<Math.min(n,items.length);k++) ws.push(worker());
  await Promise.all(ws);
}

// ── QUOTES ────────────────────────────────────────────────────────
function r2(x){return Math.round(x*100)/100}
async function fetchQ(ticker){

    var q=d.quoteResponse.result[0];
    var price=q.regularMarketPrice,prev=q.regularMarketPreviousClose||price;
    if(price){
      var o={ticker:ticker,name:(wm?wm.n:null)||q.shortName||q.longName||ticker,
        price:r2(price),pct:r2(q.regularMarketChangePercent||0),change:r2(q.regularMarketChange||0),prev:r2(prev),
        high:q.regularMarketDayHigh||null,low:q.regularMarketDayLow||null,
        vol:q.regularMarketVolume||null,avgVol:q.averageDailyVolume3Month||q.averageDailyVolume10Day||null,
        hi52:q.fiftyTwoWeekHigh||null,lo52:q.fiftyTwoWeekLow||null,
        earnTs:q.earningsTimestamp||q.earningsTimestampStart||null};
      var st=q.marketState||'';
      if(q.preMarketPrice&&(st==='PRE'||st==='PREPRE')){o.pmPrice=q.preMarketPrice;o.pmPct=q.preMarketChangePercent||((q.preMarketPrice-price)/price*100);o.isPremarket=true}
      else if(q.postMarketPrice&&(st==='POST'||st==='POSTPOST'||st==='CLOSED')){o.pmPrice=q.postMarketPrice;o.pmPct=q.postMarketChangePercent||((q.postMarketPrice-price)/price*100);o.isPremarket=false}
      return o;
    }
  }
  d=await fetchJSON('https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=5d');
  if(d&&d.chart&&d.chart.result&&d.chart.result[0]){
    var m=d.chart.result[0].meta,p=m.regularMarketPrice||m.previousClose,pv=m.previousClose||m.chartPreviousClose||p;
    if(!p) return null;
    return{ticker:ticker,name:(wm?wm.n:null)||m.shortName||ticker,price:r2(p),pct:r2((p-pv)/pv*100),change:r2(p-pv),prev:r2(pv),
      high:m.regularMarketDayHigh||null,low:m.regularMarketDayLow||null,vol:m.regularMarketVolume||null,avgVol:null,
      hi52:m.fiftyTwoWeekHigh||null,lo52:m.fiftyTwoWeekLow||null,earnTs:null};
  }
  return null;
}

// ── DAILY HISTORY (cached once per ET day) ───────────────────────
function etNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}))}
function etDateStr(){var d=etNow();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function etMins(){var d=etNow();return d.getHours()*60+d.getMinutes()}
function pad2(n){return(n<10?'0':'')+n}

async function fetchHist(ticker){
  var key='pp_h_'+ticker,c=lsGet(key,null),today=etDateStr();
  if(c&&c.d===today&&c.c&&c.c.length>60) return c;
  var d=await fetchJSON('https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(ysym(ticker))+'?interval=1d&range=1y',12000);
  if(!(d&&d.chart&&d.chart.result&&d.chart.result[0])) return c; // stale cache beats nothing
  var r=d.chart.result[0],q=r.indicators&&r.indicators.quote&&r.indicators.quote[0];
  if(!q) return c;
  var out={d:today,c:[],h:[],l:[],v:[]};
  for(var i=0;i<(r.timestamp||[]).length;i++){
    if(q.close[i]==null||q.high[i]==null||q.low[i]==null) continue;
    out.c.push(r2(q.close[i]));out.h.push(r2(q.high[i]));out.l.push(r2(q.low[i]));out.v.push(q.volume[i]||0);
  }
  if(out.c.length<60) return c;
  lsSet(key,out);
  return out;
}

// ── INDICATORS ────────────────────────────────────────────────────
function sma(a,n){if(a.length<n)return null;var s=0;for(var i=a.length-n;i<a.length;i++)s+=a[i];return s/n}
function rsi(c,n){
  if(c.length<n+1) return null;
  var g=0,l=0,i;
  for(i=1;i<=n;i++){var d=c[i]-c[i-1];if(d>0)g+=d;else l-=d}
  g/=n;l/=n;
  for(i=n+1;i<c.length;i++){var d2=c[i]-c[i-1];g=(g*(n-1)+(d2>0?d2:0))/n;l=(l*(n-1)+(d2<0?-d2:0))/n}
  if(l===0) return 100;
  return 100-100/(1+g/l);
}
function atr(h,l,c,n){
  if(c.length<n+1) return null;
  var a=0,i,tr;
  for(i=1;i<=n;i++){tr=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));a+=tr}
  a/=n;
  for(i=n+1;i<c.length;i++){tr=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));a=(a*(n-1)+tr)/n}
  return a;
}
function hvAt(c,end,n){ // annualized % stdev of log returns ending at index end
  if(end<n) return null;
  var rs=[],i;
  for(i=end-n+1;i<=end;i++) rs.push(Math.log(c[i]/c[i-1]));
  var m=rs.reduce(function(a,b){return a+b},0)/rs.length;
  var v=rs.reduce(function(a,b){return a+(b-m)*(b-m)},0)/(rs.length-1);
  return Math.sqrt(v*252)*100;
}
// swing-pivot support/resistance, clustered within 1.2%
function pivotLevels(h,l,lookback,k){
  var start=Math.max(k,h.length-lookback),pts=[],i,j;
  for(i=start;i<h.length-k;i++){
    var isH=true,isL=true;
    for(j=i-k;j<=i+k;j++){if(h[j]>h[i])isH=false;if(l[j]<l[i])isL=false}
    if(isH) pts.push(h[i]);
    if(isL) pts.push(l[i]);
  }
  pts.sort(function(a,b){return a-b});
  var cl=[];
  pts.forEach(function(p){
    var last=cl[cl.length-1];
    if(last&&Math.abs(p-last.p)/last.p<0.012){last.s+=p;last.n++;last.p=last.s/last.n}
    else cl.push({p:p,s:p,n:1});
  });
  return cl.map(function(x){return{p:r2(x.p),n:x.n}});
}
function computeInd(H){
  var c=H.c,h=H.h,l=H.l,n=c.length,last=c[n-1];
  var hvs=[];
  for(var i=Math.max(21,n-252);i<n;i++){var v=hvAt(c,i,20);if(v!=null)hvs.push(v)}
  var hv=hvs[hvs.length-1];
  var hvMin=Math.min.apply(null,hvs),hvMax=Math.max.apply(null,hvs);
  var hvRank=hvMax>hvMin?Math.round((hv-hvMin)/(hvMax-hvMin)*100):50;
  var lv=pivotLevels(h,l,180,3);
  var hi52=Math.max.apply(null,h.slice(-252)),lo52=Math.min.apply(null,l.slice(-252));
  return{last:last,sma20:sma(c,20),sma50:sma(c,50),sma200:sma(c,200),rsi:rsi(c,14),atr:atr(h,l,c,14),
    hv:hv,hvRank:hvRank,hi52:hi52,lo52:lo52,levels:lv,
    ret20:n>20?(last/c[n-21]-1)*100:null,closes:c.slice(-60)};
}
async function loadInd(t){
  var H=await fetchHist(t);
  if(H&&H.c&&H.c.length>60) IND[t]=computeInd(H);
}
function trendOf(t,price){
  var i=IND[t];if(!i||!i.sma50) return'n/a';
  var p=price||i.last;
  if(i.sma200){
    if(p>i.sma50&&i.sma50>i.sma200) return'up';
    if(p<i.sma50&&i.sma50<i.sma200) return'down';
    return'mixed';
  }
  return p>i.sma50?'up':'down';
}

// ── LEVELS / VOL ──────────────────────────────────────────────────
function getLevels(ticker,price){
  var i=IND[ticker];
  if(!i) return null;
  var res=i.levels.filter(function(x){return x.p>price*1.003}).map(function(x){return x.p});
  var sup=i.levels.filter(function(x){return x.p<price*0.997}).map(function(x){return x.p}).reverse();
  if(i.hi52>price*1.003&&res.indexOf(r2(i.hi52))<0) res.push(r2(i.hi52));
  res.sort(function(a,b){return a-b});
  if(!res.length&&i.atr) res=[r2(price+2*i.atr),r2(price+4*i.atr)];
  if(!sup.length&&i.atr) sup=[r2(price-2*i.atr),r2(price-4*i.atr)];
  res=res.slice(0,4);sup=sup.slice(0,4);
  var nearRes=res[0]||null,nearSup=sup[0]||null;
  return{resistance:res,support:sup,nearRes:nearRes,nearSup:nearSup,
    distRes:nearRes?((nearRes-price)/price*100):null,distSup:nearSup?((price-nearSup)/price*100):null,
    nearResistance:!!(nearRes&&((nearRes-price)/price*100)<1.5),nearSupport:!!(nearSup&&((price-nearSup)/price*100)<1.5),
    atr:i.atr,sma20:i.sma20,sma50:i.sma50,sma200:i.sma200};
}
function getIV(ticker){var i=IND[ticker];return i?i.hvRank:null}
function ivLabel(iv){
  if(iv==null) return{l:'No history yet',c:'#6b7280',cls:'iv-mid',rec:'Vol rank needs 1y of daily history. Refresh once data loads.'};
  if(iv>=80) return{l:'Very High · Use Spreads',c:'#ef4444',cls:'iv-high',rec:'Vol rank '+iv+' — volatility near its 1-year high, so premiums are rich. Spreads beat naked calls here.'};
  if(iv>=55) return{l:'Elevated · Consider Spreads',c:'#f59e0b',cls:'iv-mid',rec:'Vol rank '+iv+' — above average. Spreads cut cost; naked calls only on strong setups.'};
  return{l:'Low · Buying Is Cheap',c:'#10b981',cls:'iv-low',rec:'Vol rank '+iv+' — volatility near the low end of its range. Buying calls/puts is relatively cheap.'};
}
function ivCol(iv){return iv==null?'#6b7280':iv>=80?'#ef4444':iv>=55?'#f59e0b':'#10b981'}

// ── OPTION PRICING (Black-Scholes, realized vol as IV proxy) ─────
var RFR=0.04;
function ncdf(x){var t=1/(1+0.2316419*Math.abs(x)),d=0.3989423*Math.exp(-x*x/2),p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return x>0?1-p:p}
function bs(S,K,T,sig,isCall){
  if(T<=0||sig<=0) return Math.max(0,isCall?S-K:K-S);
  var sq=sig*Math.sqrt(T),d1=(Math.log(S/K)+(RFR+sig*sig/2)*T)/sq,d2=d1-sq,disc=Math.exp(-RFR*T);
  return isCall?S*ncdf(d1)-K*disc*ncdf(d2):K*disc*ncdf(-d2)-S*ncdf(-d1);
}
function bsDelta(S,K,T,sig,isCall){
  if(T<=0) return isCall?(S>K?1:0):(S<K?-1:0);
  var d1=(Math.log(S/K)+(RFR+sig*sig/2)*T)/(sig*Math.sqrt(T));
  return isCall?ncdf(d1):ncdf(d1)-1;
}
// implied vol usually trades above realized; 1.15x with a 15% floor
function sigmaFor(t){var i=IND[t];return i&&i.hv?Math.max(0.15,i.hv/100*1.15):0.45}
function expMs(iso){var p=iso.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2],20,0)} // 4PM ET ≈ 20:00 UTC
function yearsTo(iso){return Math.max(0,(expMs(iso)-Date.now())/(365*86400000))}
function daysTo(iso){return(expMs(iso)-Date.now())/86400000}
// modeled fills: pay ~3% + 2c over mid to open, receive ~3% - 2c under mid to close
function fillBuy(mid){return r2(mid*1.03+0.02)}
function fillSell(mid){return Math.max(0,r2(mid*0.97-0.02))}
function optQuote(t,S,K,iso,isCall){
  var T=yearsTo(iso),sig=sigmaFor(t),mid=bs(S,K,T,sig,isCall);
  return{mid:r2(mid),ask:fillBuy(mid),bid:fillSell(mid),delta:bsDelta(S,K,T,sig,isCall),sig:sig,T:T};
}

// ── EXPIRATIONS ───────────────────────────────────────────────────
function isoOf(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function fmtExp(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('en-US',{month:'short',day:'numeric'})+" '"+p[0].slice(2)}
function fridayAtLeast(days){var d=etNow();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);while(d.getDay()!==5)d.setDate(d.getDate()+1);return isoOf(d)}
function thirdFriday(y,m){var d=new Date(y,m,1,12),f=0;while(true){if(d.getDay()===5){f++;if(f===3)return d}d.setDate(d.getDate()+1)}}
function monthlyAtLeast(days){
  var now=etNow();
  for(var k=0;k<36;k++){var tf=thirdFriday(now.getFullYear(),now.getMonth()+k);if((tf-now)/86400000>=days)return isoOf(tf)}
  return fridayAtLeast(days);
}
function leapsJan(minDays){
  var now=etNow();
  for(var y=now.getFullYear();y<now.getFullYear()+4;y++){var tf=thirdFriday(y,0);if((tf-now)/86400000>=minDays)return isoOf(tf)}
  return monthlyAtLeast(minDays);
}
function todayIso(){return etDateStr()}
function roundStrike(p){if(p>=1000)return Math.round(p/10)*10;if(p>=200)return Math.round(p/5)*5;if(p>=50)return Math.round(p/2.5)*2.5;if(p>=20)return Math.round(p);return Math.round(p*2)/2}

// ── SCORE ─────────────────────────────────────────────────────────
function scoreM(m){
  var s=0,sigs=[],gap=Math.abs(m.pct);
  var wl=wlOf(m.ticker),ind=IND[m.ticker];
  var rv=m.vol&&m.avgVol?m.vol/m.avgVol:1;
  var lv=getLevels(m.ticker,m.price);
  var iv=getIV(m.ticker);
  var tr=trendOf(m.ticker,m.price);
  var upDay=m.pct>=0;
  if(gap>=4&&gap<=7){s+=25;sigs.push({t:'Move '+gap.toFixed(1)+'% · ideal range',c:'g'})}
  else if(gap>7&&gap<=12){s+=20;sigs.push({t:'Move '+gap.toFixed(1)+'% · strong momentum',c:'g'})}
  else if(gap>12&&gap<=20){s+=12;sigs.push({t:'Move '+gap.toFixed(1)+'% · watch reversal',c:'y'})}
  else if(gap>20){s+=5;sigs.push({t:'Move '+gap.toFixed(1)+'% · high reversal risk',c:'r'})}
  else if(gap>=1){s+=8;sigs.push({t:'Move '+gap.toFixed(1)+'% · minor',c:'y'})}
  else{s+=2;sigs.push({t:'Flat',c:'r'})}
  if(rv>=3){s+=20;sigs.push({t:'Vol '+rv.toFixed(1)+'x · institutional',c:'g'})}
  else if(rv>=2){s+=15;sigs.push({t:'Vol '+rv.toFixed(1)+'x · strong',c:'g'})}
  else if(rv>=1.5){s+=10;sigs.push({t:'Vol '+rv.toFixed(1)+'x · moderate',c:'y'})}
  else{s+=4;sigs.push({t:'Vol '+rv.toFixed(1)+'x · weak',c:'r'})}
  if(wl){s+=10;sigs.push({t:'Core watchlist · liquid options',c:'g'})}
  else{s+=5;sigs.push({t:'Not on core watchlist',c:'y'})}
  if(tr==='up'||tr==='down'){
    var aligned=(tr==='up'&&upDay)||(tr==='down'&&!upDay);
    if(aligned){s+=12;sigs.push({t:'Trend aligned ('+(tr==='up'?'above':'below')+' 50/200 SMA)',c:'g'})}
    else{s-=6;sigs.push({t:'Counter-trend move ('+tr+'trend)',c:'r'})}
  }
  if(ind&&ind.rsi!=null){
    if(upDay&&ind.rsi>75){s-=8;sigs.push({t:'RSI '+ind.rsi.toFixed(0)+' · overbought',c:'r'})}
    else if(!upDay&&ind.rsi<25){s-=8;sigs.push({t:'RSI '+ind.rsi.toFixed(0)+' · oversold',c:'r'})}
    else sigs.push({t:'RSI '+ind.rsi.toFixed(0),c:'y'});
  }
  if(lv){
    if(lv.nearResistance&&upDay){s-=8;sigs.push({t:'Near resistance $'+lv.nearRes+' ('+lv.distRes.toFixed(1)+'%) · fade risk',c:'r'})}
    else if(lv.nearSupport&&!upDay){s+=8;sigs.push({t:'At support $'+lv.nearSup+' · bounce watch',c:'g'})}
    else if(upDay&&lv.nearRes){sigs.push({t:'Next resistance $'+lv.nearRes+' (+'+lv.distRes.toFixed(1)+'%)',c:'y'})}
    else if(!upDay&&lv.nearSup){sigs.push({t:'Support $'+lv.nearSup+' (-'+lv.distSup.toFixed(1)+'%)',c:'y'})}
  }
  if(iv!=null){
    if(iv>=80){s-=5;sigs.push({t:'Vol rank '+iv+' · rich premiums, use spreads',c:'r'})}
    else if(iv>=55){sigs.push({t:'Vol rank '+iv+' · elevated',c:'y'})}
    else{s+=5;sigs.push({t:'Vol rank '+iv+' · cheap premiums',c:'g'})}
  }
  if(upDay){s+=10;sigs.push({t:'Up day · bullish',c:'g'})}else{s+=8;sigs.push({t:'Down day · put setup',c:'y'})}
  if(m.price>=5&&m.price<=1500){s+=5}
  var play,pc,strat,plan=planFor(m.ticker,m.price,upDay);
  var nearRes=lv&&lv.nearResistance&&upDay;
  if(nearRes){play='Resistance Put';pc='pfd';strat='Pressing resistance $'+lv.nearRes+'. Puts only if it rejects (red candle off the level). Target $'+(lv.nearSup||'support')+'.'}
  else if(s>=55&&upDay&&gap>=2){play='Gap & Go';pc='pgo';strat='Strong move + volume. Calls after 9:45 AM only if it holds the opening range high. '+plan.txt}
  else if(s>=40&&upDay){play='Swing Calls';pc='psw';strat='Let the first 30 min settle. '+plan.txt}
  else if(s>=30&&!upDay){play='Puts Setup';pc='pfd';strat='Down move. Puts on a failed bounce. Target support '+(lv&&lv.nearSup?'$'+lv.nearSup:'below')+'.'}
  else if(s>=35){play='Watch';pc='pwt';strat='Monitor first 30 min. Enter only on volume confirmation.'}
  else{play='Skip';pc='psk';strat='Low conviction. Pass.'}
  return{s:Math.max(0,Math.min(100,Math.round(s))),sigs:sigs,play:play,pc:pc,strat:strat,wl:wl,rv:rv,lv:lv,iv:iv,trend:tr,plan:plan};
}
// entry / stop / target from computed levels (underlying prices)
function planFor(t,price,bull){
  var i=IND[t],lv=getLevels(t,price);
  if(!i||!lv||!i.atr) return{txt:'',entry:null,stop:null,target:null};
  var a=i.atr,e1,e2,stop,tgt;
  if(bull){
    e1=Math.max(lv.nearSup||0,(i.sma20||price)-0.5*a,price-1.5*a);e2=price;
    stop=Math.min(lv.nearSup||price-a,e1)-0.5*a;
    tgt=lv.nearRes&&lv.nearRes>price+0.5*a?lv.nearRes:price+2*a;
  }else{
    e2=Math.min(lv.nearRes||1e9,(i.sma20||price)+0.5*a,price+1.5*a);e1=price;
    stop=Math.max(lv.nearRes||price+a,e2)+0.5*a;
    tgt=lv.nearSup&&lv.nearSup<price-0.5*a?lv.nearSup:price-2*a;
  }
  var lo=Math.min(e1,e2),hi=Math.max(e1,e2);
  return{entry:[r2(lo),r2(hi)],stop:r2(stop),target:r2(tgt),
    txt:'Entry $'+lo.toFixed(2)+'–$'+hi.toFixed(2)+' · stop $'+stop.toFixed(2)+' · target $'+tgt.toFixed(2)+'.'};
}

// PAPER-TRADING BOT
// Every order goes through executeOrder(). Today the only route is
// PAPER. A live broker route (Schwab/TOS, Webull) has to run on a
// server you control — see AUTOMATION.md — and plugs in right there.
// ═════════════════════════════════════════════════════════════════
var PPK='pp_paper_v1';
var CFG_DEFAULT={start:10000,maxPer:750,maxOpen:5,tp:20,sl:35,minScore:60,minDTE:21,timeStop:7,otm:2,auto:true,skipEarn:true,learn:true,regime:true};
var PP=ppLoad();
function ppLoad(){
  var p=lsGet(PPK,null);
  if(!p||!p.trades) p={v:1,cfg:{},trades:[],log:[],created:Date.now()};
  p.cfg=Object.assign({},CFG_DEFAULT,p.cfg||{});
  return p;
}
function ppSave(){if(PP.log.length>300)PP.log=PP.log.slice(-300);lsSet(PPK,PP)}
function ppLog(msg){PP.log.push({at:Date.now(),m:msg})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

// ── ORDER LAYER (broker-neutral) ─────────────────────────────────
function occSymbol(t,iso,dir,strike,schwabPad){
  var root=t==='SPX'?'SPXW':t;
  var d=iso.replace(/-/g,'').slice(2);
  var k=String(Math.round(strike*1000));while(k.length<8)k='0'+k;
  if(schwabPad){while(root.length<6)root+=' '}
  return root+d+dir+k;
}
function makeOrder(t,dir,strike,iso,qty,limit,side){
  return{symbol:t,dir:dir,strike:strike,exp:iso,qty:qty,limit:limit,side:side||'BUY_TO_OPEN',type:'LIMIT',tif:'DAY',
    occ:occSymbol(t,iso,dir,strike,false)};
}
function toSchwab(o){ // Schwab Trader API single-leg option order body
  return{orderType:'LIMIT',session:'NORMAL',duration:'DAY',orderStrategyType:'SINGLE',price:o.limit.toFixed(2),
    orderLegCollection:[{instruction:o.side,quantity:o.qty,instrument:{symbol:occSymbol(o.symbol,o.exp,o.dir,o.strike,true),assetType:'OPTION'}}]};
}
function tosLine(o){
  var p=o.exp.split('-'),mon=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][+p[1]-1];
  var buy=o.side.indexOf('BUY')===0;
  return(buy?'BUY +':'SELL -')+o.qty+' '+o.symbol+' 100 '+p[2]+' '+mon+' '+p[0].slice(2)+' '+o.strike+' '+(o.dir==='C'?'CALL':'PUT')+' @'+o.limit.toFixed(2)+' LMT';
}
function webullLine(o){
  var p=o.exp.split('-');
  return o.symbol+' '+p[1]+'/'+p[2]+'/'+p[0].slice(2)+' $'+o.strike+' '+(o.dir==='C'?'Call':'Put')+' · '+(o.side==='BUY_TO_OPEN'?'Buy to Open':'Sell to Close')+' · Qty '+o.qty+' · Limit $'+o.limit.toFixed(2)+' · Day';
}
var BROKER='paper'; // only 'paper' is implemented in the browser
function executeOrder(o){
  if(BROKER!=='paper') throw new Error('Live routing must go through a server relay (see AUTOMATION.md)');
  return{filled:true,px:o.limit,at:Date.now()}; // paper: modeled fill at the limit
}

// ── POSITIONS ─────────────────────────────────────────────────────
function openTrades(){return PP.trades.filter(function(t){return!t.exit})}
function closedTrades(){return PP.trades.filter(function(t){return!!t.exit})}
function tPnl(t){var px=t.exit?t.exit.px:(t.mark?t.mark.px:t.entry.px);return(px-t.entry.px)*100*t.qty}
function tPct(t){var px=t.exit?t.exit.px:(t.mark?t.mark.px:t.entry.px);return t.entry.px?(px/t.entry.px-1)*100:0}
function ppRealized(){return closedTrades().reduce(function(a,t){return a+tPnl(t)},0)}
function ppOpenCost(){return openTrades().reduce(function(a,t){return a+t.entry.px*100*t.qty},0)}
function ppEquity(){return PP.cfg.start+ppRealized()+openTrades().reduce(function(a,t){return a+tPnl(t)},0)}
function ppCash(){return PP.cfg.start+ppRealized()-ppOpenCost()}

function featuresOf(m,sc){
  var i=IND[m.ticker]||{};
  return{score:sc.s,move:m.pct,rv:r2(sc.rv),trend:sc.trend,rsi:i.rsi!=null?Math.round(i.rsi):null,vr:sc.iv,play:sc.play,regime:regimeOf().k};
}
function dirOfPlay(play){
  if(play==='Gap & Go'||play==='Swing Calls') return'C';
  if(play==='Puts Setup'||play==='Resistance Put') return'P';
  return null;
}
// open a paper position; returns trade or error string
function ppOpen(t,dir,strike,iso,src,play,feat,qtyOverride){
  var m=quoteOf(t);
  if(!m) return'No live quote for '+t;
  if(daysTo(iso)<0) return'Expiry already passed';
  if(openTrades().some(function(x){return x.ticker===t&&x.dir===dir&&x.strike===strike&&x.exp===iso})) return'Already holding that contract';
  var q=optQuote(t,m.price,strike,iso,dir==='C');
  if(q.ask<0.05) return'Modeled premium too small';
  var qty=qtyOverride||Math.floor(PP.cfg.maxPer/(q.ask*100));
  if(qty<1) return'1 contract ($'+(q.ask*100).toFixed(0)+') exceeds max per trade ($'+PP.cfg.maxPer+')';
  if(q.ask*100*qty>ppCash()) return'Not enough paper cash';
  var o=makeOrder(t,dir,strike,iso,qty,q.ask,'BUY_TO_OPEN');
  var f=executeOrder(o);
  var tr={id:uid(),ticker:t,dir:dir,strike:strike,exp:iso,qty:qty,src:src,play:play||'Manual',f:feat||null,order:o,
    entry:{px:f.px,und:m.price,at:f.at,sig:r2(q.sig)},mark:{px:q.bid,und:m.price,at:f.at},peak:q.bid,exit:null};
  PP.trades.push(tr);
  ppLog((src==='auto'?'🤖 Opened ':'📝 Opened ')+t+' '+fmtExp(iso)+' $'+strike+(dir==='C'?'C':'P')+' x'+qty+' @ $'+f.px.toFixed(2)+(play?' · '+play:''));
  ppSave();
  return tr;
}
function ppClose(id,reason,pxOverride){
  var t=PP.trades.find(function(x){return x.id===id});
  if(!t||t.exit) return;
  var m=quoteOf(t.ticker),S=m?m.price:t.mark.und;
  var px=pxOverride!=null?pxOverride:optQuote(t.ticker,S,t.strike,t.exp,t.dir==='C').bid;
  var o=makeOrder(t.ticker,t.dir,t.strike,t.exp,t.qty,px,'SELL_TO_CLOSE');
  executeOrder(o);
  t.exit={px:px,und:S,at:Date.now(),reason:reason};
  ppLog((tPnl(t)>=0?'✅ ':'❌ ')+'Closed '+t.ticker+' $'+t.strike+t.dir+' · '+reason+' · '+(tPnl(t)>=0?'+':'')+money(tPnl(t))+' ('+tPct(t).toFixed(0)+'%)');
  ppSave();
}
function manualClose(id){ppClose(id,'Manual close');renderBot();updateBotStat();toast('Closed')}

// ── REGIME (VIX term structure + SPY trend) ─────────────────────
function regimeOf(){
  var pts=0,why=[];
  var spy=quoteOf('SPY'),si=IND.SPY;
  if(VIX!=null&&VIX3M!=null&&VIX>VIX3M){pts+=2;why.push('VIX above VIX3M (backwardation)')}
  if(VIX!=null&&VIX>=25){pts+=1;why.push('VIX '+VIX.toFixed(1)+' ≥ 25')}
  if(spy&&si&&si.sma50&&spy.price<si.sma50){pts+=1;why.push('SPY below 50-day')}
  if(spy&&si&&si.sma200&&spy.price<si.sma200){pts+=2;why.push('SPY below 200-day')}
  if(VIX==null&&!si) return{k:'unknown',l:'Unknown',c:'#6b7280',why:['Waiting for VIX/SPY data']};
  if(pts>=3) return{k:'off',l:'Risk-off',c:'#ef4444',why:why};
  if(pts>=1) return{k:'caution',l:'Caution',c:'#f59e0b',why:why};
  return{k:'on',l:'Risk-on',c:'#10b981',why:['SPY above 50/200-day, VIX calm']};
}

// ── LEARNING ──────────────────────────────────────────────────────
function statsOf(list){
  var n=list.length,w=0,gw=0,gl=0,sp=0,sum=0;
  list.forEach(function(t){var p=tPnl(t);sum+=p;sp+=tPct(t);if(p>0){w++;gw+=p}else gl+=-p});
  return{n:n,wr:n?w/n*100:0,exp:n?sum/n:0,avgPct:n?sp/n:0,pf:gl?gw/gl:(gw>0?99:0),sum:sum};
}
function groupStats(list,keyFn){
  var g={};
  list.forEach(function(t){var k=keyFn(t);if(k==null)return;(g[k]=g[k]||[]).push(t)});
  return Object.keys(g).map(function(k){var s=statsOf(g[k]);s.k=k;return s}).sort(function(a,b){return b.n-a.n});
}
var MIN_SAMPLE=10;
function learned(){
  var cl=closedTrades().filter(function(t){return t.f&&t.src==='auto'});
  var out={blocked:[],minScore:PP.cfg.minScore,requireTrend:false,notes:[],n:cl.length};
  if(!PP.cfg.learn) return out;
  groupStats(cl,function(t){return t.play}).forEach(function(s){
    if(s.n>=MIN_SAMPLE&&s.exp<0){out.blocked.push(s.k);out.notes.push('Blocked "'+s.k+'": '+s.n+' trades, '+s.wr.toFixed(0)+'% win, avg $'+s.exp.toFixed(0))}
  });
  groupStats(cl,function(t){return Math.floor(t.f.score/10)*10}).forEach(function(s){
    var b=+s.k;
    if(s.n>=MIN_SAMPLE&&s.exp<0&&b+10>out.minScore){out.minScore=b+10;out.notes.push('Raised min score to '+(b+10)+': score '+b+'s lost avg $'+(-s.exp).toFixed(0)+' over '+s.n+' trades')}
  });
  var ct=cl.filter(function(t){return t.f.trend!=='n/a'&&t.f.trend!=='mixed'&&((t.f.trend==='up')!==(t.dir==='C'))});
  var cs=statsOf(ct);
  if(cs.n>=MIN_SAMPLE&&cs.exp<0){out.requireTrend=true;out.notes.push('Counter-trend entries disabled: '+cs.n+' trades, avg $'+cs.exp.toFixed(0))}
  if(!out.notes.length) out.notes.push(cl.length<MIN_SAMPLE?'Need '+(MIN_SAMPLE-cl.length)+' more closed bot trades before rules start adapting.':'No setup has a losing record over '+MIN_SAMPLE+'+ trades yet. Rules unchanged.');
  return out;
}

// ── GRADUATION GATE (paper → real money) ─────────────────────────
function equityCurve(){
  var cl=closedTrades().slice().sort(function(a,b){return a.exit.at-b.exit.at}),eq=PP.cfg.start,pk=eq,dd=0,pts=[eq];
  cl.forEach(function(t){eq+=tPnl(t);pts.push(eq);if(eq>pk)pk=eq;dd=Math.max(dd,(pk-eq)/pk*100)});
  return{pts:pts,maxDD:dd};
}
function gradChecks(){
  var cl=closedTrades(),s=statsOf(cl),ec=equityCurve();
  var span=0;
  if(cl.length){var ts=cl.map(function(t){return t.entry.at});span=(Date.now()-Math.min.apply(null,ts))/86400000}
  return[
    {l:'50+ closed trades',ok:cl.length>=50,v:cl.length+'/50',p:Math.min(1,cl.length/50)},
    {l:'6+ weeks of history',ok:span>=42,v:Math.floor(span)+'/42 days',p:Math.min(1,span/42)},
    {l:'Positive expectancy',ok:s.n>0&&s.exp>0,v:'$'+s.exp.toFixed(0)+'/trade',p:s.exp>0?1:0},
    {l:'Profit factor ≥ 1.3',ok:s.pf>=1.3,v:s.pf.toFixed(2),p:Math.min(1,s.pf/1.3)},
    {l:'Max drawdown ≤ 20%',ok:cl.length>0&&ec.maxDD<=20,v:ec.maxDD.toFixed(1)+'%',p:cl.length?Math.max(0,Math.min(1,(40-ec.maxDD)/20)):0}
  ];
}

// ── BOT LOOP (runs after every refresh) ──────────────────────────
function botTick(){
  var now=Date.now(),cfg=PP.cfg,open=mktOpen(),em=etMins(),acted=0;
  // 1) mark + exits
  openTrades().forEach(function(t){
    var m=quoteOf(t.ticker);
    var dte=daysTo(t.exp);
    if(dte<=0){
      var S0=m?m.price:t.mark.und,intr=Math.max(0,t.dir==='C'?S0-t.strike:t.strike-S0);
      ppClose(t.id,'Expired',r2(intr));acted++;return;
    }
    if(!m) return;
    var q=optQuote(t.ticker,m.price,t.strike,t.exp,t.dir==='C');
    t.mark={px:q.bid,und:m.price,at:now};t.peak=Math.max(t.peak||0,q.bid);
    if(!open) return;
    var pct=tPct(t),eq=quoteOf(t.ticker),eTs=eq&&eq.earnTs?eq.earnTs*1000:null;
    if(pct>=cfg.tp){ppClose(t.id,'Take profit +'+cfg.tp+'%');acted++}
    else if(pct<=-cfg.sl){ppClose(t.id,'Stop -'+cfg.sl+'%');acted++}
    else if(dte<=cfg.timeStop){ppClose(t.id,'Time stop ('+Math.ceil(dte)+' DTE)');acted++}
    else if(cfg.skipEarn&&eTs&&eTs>now&&eTs-now<36*3600000){ppClose(t.id,'Exit before earnings');acted++}
  });
  // 2) entries
  if(cfg.auto&&open&&em>=585&&em<=945){
    var L=learned(),reg=regimeOf(),today=etDateStr();
    var cands=movers.map(function(m){var sc=scoreM(m);return{m:m,sc:sc,dir:dirOfPlay(sc.play)}})
      .filter(function(c){return c.dir&&c.sc.s>=L.minScore&&L.blocked.indexOf(c.sc.play)<0})
      .filter(function(c){return!(L.requireTrend&&c.sc.trend!=='n/a'&&c.sc.trend!=='mixed'&&((c.sc.trend==='up')!==(c.dir==='C')))})
      .filter(function(c){return!(cfg.regime&&reg.k==='off'&&c.dir==='C')})
      .filter(function(c){return IND[c.m.ticker]}) // need history to price it
      .sort(function(a,b){return b.sc.s-a.sc.s});
    for(var i=0;i<cands.length&&openTrades().length<cfg.maxOpen;i++){
      var c=cands[i],t=c.m.ticker;
      if(PP.trades.some(function(x){return x.ticker===t&&(!x.exit||isoOf(new Date(x.entry.at))===today)})) continue;
      var iso=fridayAtLeast(cfg.minDTE);
      if(cfg.skipEarn&&c.m.earnTs&&c.m.earnTs*1000>now&&c.m.earnTs*1000<expMs(iso)) continue;
      var k=roundStrike(c.m.price*(c.dir==='C'?1+cfg.otm/100:1-cfg.otm/100));
      var r=ppOpen(t,c.dir,k,iso,'auto',c.sc.play,featuresOf(c.m,c.sc));
      if(typeof r!=='string') acted++;
    }
  }
  LAST_RUN=now;PP.lastRun=now;ppSave();updateBotStat();
  return acted;
}
function updateBotStat(){
  var el=document.getElementById('sBot');if(!el)return;
  var p=ppEquity()-PP.cfg.start;
  el.textContent=(p>=0?'+':'-')+'$'+fmtK(Math.abs(p));
  el.style.color=p>=0?'#10b981':'#ef4444';
}
function fmtK(x){return x>=10000?(x/1000).toFixed(1)+'K':x.toFixed(0)}
function money(x){return(x<0?'-':'')+'$'+Math.abs(x).toLocaleString(undefined,{maximumFractionDigits:0})}

function setCfg(k,v){

function exportPaper(){

  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='premarket-paper-'+etDateStr()+'.json';

function importPaper(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{var d=JSON.parse(rd.result);if(!d.trades||!Array.isArray(d.trades))throw 0;
      if(!confirm('Replace current paper history with '+d.trades.length+' trades from file?'))return;
      PP=d;PP.cfg=Object.assign({},CFG_DEFAULT,d.cfg||{});PP.log=PP.log||[];ppSave();renderBot();updateBotStat();toast('Imported')}
    catch(e){toast('Not a valid export file',true)}

async function go(){
  if(BUSY) return;
  BUSY=true;
  var btn=document.getElementById('rb');btn.classList.add('spinning');
  var res=[],done=0,first=movers.length===0;
  setStat('Loading quotes…','scl');
  await pool(ALL_T,4,async function(t){
    var q=await fetchQ(t);done++;
    if(first) setLoad('Fetching quotes… '+done+'/'+ALL_T.length);
    if(q&&q.price>0) res.push(q);
  });
  var vq=await fetchQ('^VIX'),v3=await fetchQ('^VIX3M');
  VIX=vq?vq.price:null;VIX3M=v3?v3.price:null;
  if(VIX!=null){var sv=document.getElementById('sVix');sv.textContent=VIX.toFixed(1);sv.style.color=VIX>25?'#ef4444':VIX>18?'#f59e0b':'#10b981'}
  if(!res.length){
    btn.classList.remove('spinning');BUSY=false;
    document.getElementById('mc').innerHTML='<div class="es"><div class="ei">⚠️</div><div class="et">No data loaded</div><div class="em">Yahoo or the CORS proxies are blocking right now.<br>Try again in a minute. Open the app from<br><strong>https://ctg90.github.io/premarket/</strong></div></div>';
    setStat('No quotes loaded — proxies may be rate-limiting','ser');
    renderTab(CUR_TAB);
    return;
  }
  res.sort(function(a,b){return Math.abs(b.pct)-Math.abs(a.pct)});
  movers=res;
  // daily history for watchlist + holdings (cached once per day)
  setStat('Computing levels from daily history…','scl');
  var need=WL.map(function(w){return w.t}).concat(EXTRA);
  await pool(need,4,loadInd);
  btn.classList.remove('spinning');
  var acted=botTick();
  var open=mktOpen();
  setStat((open?'🟢 Live · ':'🟡 Last close · ')+res.length+' tickers · levels for '+Object.keys(IND).length+(VIX?' · VIX '+VIX.toFixed(1):'')+(acted?' · 🤖 '+acted+' bot action'+(acted>1?'s':''):''),open?'slv':'scl');
  document.getElementById('sT').textContent=res.length;
  var pmM=res.filter(function(m){return m.pmPrice&&Math.abs(m.pmPct||0)>=2});
  document.getElementById('sH').textContent=pmM.length?pmM.length+'🌅':res.filter(function(m){return scoreM(m).s>=65}).length;
  BUSY=false;
  render();
  renderTab(CUR_TAB);
  if(!allNews.length) loadNews();
}

function render(){
  if(!movers.length) return;
  var list=movers.map(function(m){return Object.assign({},m,scoreM(m))});
  if(filt!=='all'){
    list=list.filter(function(m){
      if(filt==='go') return m.play==='Gap & Go'||m.s>=55;
      if(filt==='sw2') return m.play==='Swing Calls'||m.play==='Watch';
      if(filt==='fd') return m.play==='Puts Setup'||m.play==='Resistance Put'||m.pct<0;
      if(filt==='wt') return m.play==='Watch'||m.play==='Skip';
      return true;
    });
  }
  if(!list.length){document.getElementById('mc').innerHTML='<div class="es"><div class="ei">🔍</div><div class="et">No matches</div></div>';return}
  document.getElementById('mc').innerHTML=list.map(buildCard).join('');
}

function autoFillCalc(){
  var t=document.getElementById('cTicker').value.toUpperCase().trim();
  var m=quoteOf(t);
  if(m){document.getElementById('cStock').value=m.price;calcPL()}

function calcPL(){
  var stock=parseFloat(document.getElementById('cStock').value)||0;
  var strike=parseFloat(document.getElementById('cStrike').value)||0;
  var prem=parseFloat(document.getElementById('cPrem').value)||0;
  var contracts=parseInt(document.getElementById('cContracts').value)||1;
  var dte=parseInt(document.getElementById('cDTE').value)||30;
  if(!stock||!strike||!prem){document.getElementById('calcResult').innerHTML='';return}
  var isCall=strike>=stock;
  var t=document.getElementById('cTicker').value.toUpperCase().trim();
  var sig=sigmaFor(t),T=dte/365;
  var totalCost=prem*contracts*100,breakeven=isCall?strike+prem:strike-prem;
  var h='<div class="calc-result"><div style="font-size:11px;color:#5b6688;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em">P&amp;L Analysis · '+(isCall?'call':'put')+' (strike '+(isCall?'≥':'<')+' price)</div>';
  h+='<div class="calc-row"><span style="font-size:12px;color:#6b7280">Total Cost</span><span style="font-size:13px;font-weight:700;color:#fff">$'+totalCost.toLocaleString()+'</span></div>';
  h+='<div class="calc-row"><span style="font-size:12px;color:#6b7280">Breakeven at Expiry</span><span style="font-size:13px;font-weight:700;color:#f59e0b">$'+breakeven.toFixed(2)+'</span></div>';
  var thetaDay=(bs(stock,strike,T,sig,isCall)-bs(stock,strike,Math.max(0,T-1/365),sig,isCall));
  h+='<div class="calc-row"><span style="font-size:12px;color:#6b7280">Theta/day (model)</span><span style="font-size:13px;font-weight:700;color:#ef4444">-$'+(thetaDay*100).toFixed(0)+'/contract</span></div>';
  h+='<div style="height:1px;background:#1a2540;margin:8px 0"></div>';
  h+='<div style="font-size:11px;color:#818cf8;font-weight:600;margin-bottom:6px">STOCK PRICE NEEDED · in 3 days vs at expiry</div>';
  [20,50,100].forEach(function(p){
    var tgt=prem*(1+p/100);
    var need3=solveUnderlying(tgt,strike,Math.max(0,T-3/365),sig,isCall,stock);
    var needE=isCall?strike+tgt:strike-tgt;
    h+='<div style="display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:4px;margin-bottom:5px;align-items:center;font-size:12px">';
    h+='<span style="font-weight:700;color:#10b981">+'+p+'%</span><span style="color:#fff;font-weight:600">$'+(tgt*contracts*100).toFixed(0)+'</span>';
    h+='<span style="color:#9ca3af">3d: $'+(need3?need3.toFixed(2):'--')+'</span><span style="color:#6b7280">exp: $'+needE.toFixed(2)+'</span></div>';
  });
  h+='<div style="height:1px;background:#1a2540;margin:8px 0"></div>';
  h+='<div class="calc-row"><span style="font-size:12px;color:#6b7280">Max Loss</span><span style="font-size:13px;font-weight:700;color:#ef4444">-$'+totalCost.toLocaleString()+'</span></div>';
  h+='<div style="font-size:10px;color:#5b6688;margin-top:8px">3-day column uses '+(IND[t]?'this ticker\'s realized vol':'a 45% vol assumption')+'. Verify in TOS. Not financial advice.</div></div>';
  document.getElementById('calcResult').innerHTML=h;
}
function solveUnderlying(target,K,T,sig,isCall,S0){
  var lo=S0*0.5,hi=S0*2;
  for(var i=0;i<60;i++){var mid=(lo+hi)/2,v=bs(mid,K,T,sig,isCall);if((v<target)===isCall)lo=mid;else hi=mid}
  var r=(lo+hi)/2;
  return Math.abs(bs(r,K,T,sig,isCall)-target)<target*0.02?r:null;
}

async function fetchNews(){
  var items=[],tickers=WL.filter(function(w){return w.sector!=='Index'}).map(function(w){return w.t});
  await pool(tickers,3,async function(t){
    var xml=await fetchText('https://feeds.finance.yahoo.com/rss/2.0/headline?s='+t+'&region=US&lang=en-US');
    if(!xml) return;
    var doc=new DOMParser().parseFromString(xml,'text/xml'),nodes=doc.querySelectorAll('item');
    for(var j=0;j<Math.min(nodes.length,3);j++){
      var node=nodes[j],title=(node.querySelector('title')||{}).textContent||'',pub=(node.querySelector('pubDate')||{}).textContent||'',link=(node.querySelector('link')||{}).textContent||'';
      if(title){var s=analyzeSentiment(title);items.push({ticker:t,title:title,pub:pub,link:link.trim(),sentiment:s.signal,trade:s.trade,category:s.cat,age:timeAgo(pub)})}
    }
  });
  items.sort(function(a,b){return new Date(b.pub)-new Date(a.pub)});
  return items;
}
function analyzeSentiment(text){
  var t=text.toLowerCase();
  var bull=['beat','beats','record','surge','rally','jump','soar','upgrade','strong','growth','raised','exceeded','breakout','contract','deal','win','profit'];
  var bear=['miss','misses','fell','fall','drop','decline','downgrade','weak','loss','cut','below','warning','lawsuit','investigation','concern','layoff','probe'];
  var earn=['earnings','eps','revenue','quarter','q1','q2','q3','q4','guidance'];
  var bs2=0,br=0;
  bull.forEach(function(w){if(t.indexOf(w)>-1)bs2++});
  bear.forEach(function(w){if(t.indexOf(w)>-1)br++});
  var isE=earn.some(function(w){return t.indexOf(w)>-1});
  if(bs2>br) return{signal:'bull',trade:'Bullish headline. Only matters if price confirms above support at the open.',cat:isE?'earn':'news'};
  if(br>bs2) return{signal:'bear',trade:'Bearish headline. Watch for a failed bounce at resistance.',cat:isE?'earn':'news'};
  return{signal:'neut',trade:'Neutral. Wait for price action.',cat:isE?'earn':'news'};
}

// SWINGS (generated from trend + levels)
// ═════════════════════════════════════════════════════════════════
var swingFilt='all';
function getSwingSetups(){
  var out=[];
  WL.forEach(function(w){
    var m=quoteOf(w.t),i=IND[w.t];if(!m||!i||!i.atr||!i.sma50) return;
    var p=m.price,tr=trendOf(w.t,p),lv=getLevels(w.t,p),sig=sigmaFor(w.t),r=i.rsi||50;
    var near20=i.sma20&&Math.abs(p-i.sma20)<=1.5*i.atr;
    if(tr==='up'&&r>=40&&r<=68){
      var iso=monthlyAtLeast(75),k=roundStrike(p*(1+0.4*sig*Math.sqrt(daysTo(iso)/365))),pl=planFor(w.t,p,true);
      out.push({t:w.t,n:w.n,tf:'90 Day',dir:'C',iso:iso,k:k,plan:pl,q:near20?'A':'B',why:(near20?'Pullback to the 20-day inside an uptrend.':'Uptrend, extended from the 20-day — wait for a dip.')+' RSI '+r.toFixed(0)+'.'});
    }
    if(tr==='down'&&r>=32&&r<=60){
      var iso2=monthlyAtLeast(75),k2=roundStrike(p*(1-0.4*sig*Math.sqrt(daysTo(iso2)/365))),pl2=planFor(w.t,p,false);
      out.push({t:w.t,n:w.n,tf:'90 Day',dir:'P',iso:iso2,k:k2,plan:pl2,q:near20?'A':'B',why:(near20?'Bounce into the 20-day inside a downtrend.':'Downtrend, stretched below the 20-day — wait for a bounce.')+' RSI '+r.toFixed(0)+'.'});
    }
    if(tr==='up'&&i.sma200&&p>i.sma200*1.02&&i.hvRank<60&&w.sector!=='Index'){
      var iso3=leapsJan(300),k3=roundStrike(p*1.1),pl3=planFor(w.t,p,true);
      out.push({t:w.t,n:w.n,tf:'LEAPS',dir:'C',iso:iso3,k:k3,plan:pl3,q:i.hvRank<35?'A':'B',why:'Long-term uptrend with vol rank '+i.hvRank+' — time is relatively cheap. Treat like stock replacement, size like stock risk.'});
    }
  });
  return out.sort(function(a,b){return a.q<b.q?-1:a.q>b.q?1:0});
}

  // bot snapshot
  var op=openTrades(),pl=ppEquity()-PP.cfg.start;
  h+='<div class="card pad" style="cursor:pointer" onclick="sw(\'bot\')"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;font-weight:700;color:#4ade80">🤖 Paper bot '+(PP.cfg.auto?'ON':'OFF')+'</div><div style="font-size:11px;color:#9ca3af">'+op.length+' open · '+closedTrades().length+' closed · '+gradChecks().filter(function(c){return c.ok}).length+'/5 graduation checks</div></div>';
  h+='<div class="cc '+(pl>=0?'up':'dn')+'">'+(pl>=0?'+':'')+money(pl)+'</div></div></div>';
  // top setups
  h+='<div class="sect" style="color:#818cf8">🎯 Top live setups</div>';
  if(!movers.length) h+='<div class="ld"><div class="sp"></div><div style="font-size:13px;color:#5b6688">Loading quotes…</div></div>';
  else{
    var top=movers.map(function(m){return{m:m,sc:scoreM(m)}}).filter(function(x){return dirOfPlay(x.sc.play)}).sort(function(a,b){return b.sc.s-a.sc.s}).slice(0,5);
    if(!top.length) h+='<div class="card pad" style="font-size:12px;color:#5b6688">No call/put setups scoring right now.</div>';
    top.forEach(function(x){
      var m=x.m,sc=x.sc,dir=dirOfPlay(sc.play),iso=fridayAtLeast(PP.cfg.minDTE),k=roundStrike(m.price*(dir==='C'?1+PP.cfg.otm/100:1-PP.cfg.otm/100)),q=IND[m.ticker]?optQuote(m.ticker,m.price,k,iso,dir==='C'):null;
      h+='<div class="card pad"><div style="display:flex;align-items:center;gap:10px"><div class="ring '+(sc.s>=70?'rh':sc.s>=50?'rm':'rl')+'">'+sc.s+'</div><div style="flex:1;min-width:0"><div class="tk">'+m.ticker+' <span class="pb '+sc.pc+'">'+sc.play+'</span></div><div class="nm">'+(q?fmtExp(iso)+' $'+k+dir+' · model ~$'+q.mid.toFixed(2):'Levels loading')+'</div></div>';
      h+='<div class="cr2"><div class="cc '+(m.pct>=0?'up':'dn')+'">'+(m.pct>=0?'+':'')+m.pct.toFixed(2)+'%</div><div class="cp">$'+m.price.toFixed(2)+'</div></div></div>';
      h+='<div style="font-size:12px;color:#9ca3af;margin-top:6px;line-height:1.5">'+sc.strat+'</div>';
      if(q) h+=ideaButtons(m.ticker,dir,k,iso,sc.play);
      h+='</div>';
    });
  }
  // earnings this week
  var now=Date.now(),soon=movers.filter(function(m){return m.earnTs&&m.earnTs*1000>now&&m.earnTs*1000-now<7*86400000});
  if(soon.length){
    h+='<div class="sect" style="color:#f59e0b">📅 Earnings next 7 days</div><div class="card pad">';
    soon.sort(function(a,b){return a.earnTs-b.earnTs}).forEach(function(m){h+='<div class="chk"><b style="color:#fff;width:52px">'+m.ticker+'</b><span style="flex:1;color:#9ca3af">'+new Date(m.earnTs*1000).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})+'</span>'+(HOLD.some(function(x){return x.t===m.ticker})?'<span class="chip b">held</span>':'')+'</div>'});
    h+='</div>';
  }
  // premarket gappers
  var pm=movers.filter(function(m){return m.pmPrice&&Math.abs(m.pmPct)>=1.5}).sort(function(a,b){return Math.abs(b.pmPct)-Math.abs(a.pmPct)}).slice(0,6);
  if(pm.length){
    h+='<div class="sect" style="color:#f59e0b">🌅 '+(pm[0].isPremarket?'Premarket':'After-hours')+' movers</div><div class="card pad">';
    pm.forEach(function(m){h+='<div class="chk"><b style="color:#fff;width:52px">'+m.ticker+'</b><span style="flex:1;color:#9ca3af">$'+m.pmPrice.toFixed(2)+'</span><span class="'+(m.pmPct>=0?'up':'dn')+'" style="font-weight:700">'+(m.pmPct>=0?'+':'')+m.pmPct.toFixed(2)+'%</span></div>'});
    h+='</div>';
  }
  h+='<div class="foot">Everything here is computed from live quotes. Modeled premiums — verify in TOS/Webull.<br>Not financial advice.</div>';
  document.getElementById('tdc').innerHTML=h;
}

// ═════════════════════════════════════════════════════════════════
// TABS / HELPERS / TIMERS
// ═════════════════════════════════════════════════════════════════
var TABS=['today','bot','movers','strikes','swings','plan','holdings','calc','earn','econ','news','flow','comm','pols','wl'];
function sw(tab){
  CUR_TAB=tab;
  TABS.forEach(function(t){document.getElementById('t-'+t).style.display=(t===tab?'block':'none')});
  document.querySelectorAll('.tab').forEach(function(b){var on=b.getAttribute('data-tab')===tab;b.classList.toggle('on',on);if(on&&b.scrollIntoView)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});
  renderTab(tab);
  window.scrollTo(0,0);
}
function renderTab(tab){
  if(tab==='today') renderToday();
  else if(tab==='bot') renderBot();
  else if(tab==='movers') render();
  else if(tab==='strikes') renderStrikes();
  else if(tab==='swings') renderSwings();
  else if(tab==='plan') renderPlan();
  else if(tab==='holdings') renderHoldings();
  else if(tab==='earn') renderEarn();
  else if(tab==='econ') renderEcon();
  else if(tab==='news'){renderNews();if(!allNews.length&&movers.length)loadNews()}
  else if(tab==='flow') renderFlow();
  else if(tab==='comm') loadCrowd();
  else if(tab==='pols'){if(!polTrades.length)loadPols();else renderPolsSorted()}
  else if(tab==='wl') renderWL();
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function openModal(h){document.getElementById('sheet').innerHTML=h;document.getElementById('modal').classList.add('on')}
function closeModal(){document.getElementById('modal').classList.remove('on')}
var TOAST_T=null;
function toast(msg,bad){var t=document.getElementById('toast');t.textContent=msg;t.style.background=bad?'#7f1d1d':'#15803d';t.style.display='block';clearTimeout(TOAST_T);TOAST_T=setTimeout(function(){t.style.display='none'},2600)}
function setLoad(msg){if(movers.length)return;document.getElementById('mc').innerHTML='<div class="ld"><div class="sp"></div><div style="font-size:13px;color:#5b6688">'+msg+'</div></div>'}
function setStat(msg,cls){var b=document.getElementById('sb');if(!msg){b.style.display='none';return}b.style.display='block';b.className='sbar '+(cls||'scl');b.textContent=msg}
function mktOpen(){var et=etNow(),d=et.getDay(),m2=et.getHours()*60+et.getMinutes();return d>0&&d<6&&m2>=570&&m2<960}
function timeAgo(s){var t=new Date(s).getTime();if(isNaN(t))return'recently';var m=Math.floor((Date.now()-t)/60000);if(m<60)return Math.max(0,m)+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago'}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function updatePMBanner(){
  var et=etNow(),d=et.getDay(),mins=et.getHours()*60+et.getMinutes(),b=document.getElementById('pmBanner');
  if(d===0||d===6){b.style.display='none';return}
  if(mins>=240&&mins<570){b.style.display='flex';document.getElementById('pmMsg').textContent='PREMARKET · auto-refresh every 5 min · opens 9:30 AM ET'}
  else if(mins>=570&&mins<960){b.style.display='flex';document.getElementById('pmMsg').textContent='MARKET OPEN · auto-refresh every 5 min'+(PP.cfg.auto?' · 🤖 bot active':'')}
  else b.style.display='none';
}
function tick(){
  var et=etNow();
  document.getElementById('clk').textContent=pad2(et.getHours())+':'+pad2(et.getMinutes());
  var d=et.getDay(),m2=et.getHours()*60+et.getMinutes();
  document.getElementById('mktStatus').textContent=d===0||d===6?'Weekend':m2>=570&&m2<960?'Market Open':m2>=240&&m2<570?'Premarket':'After Hours';
}
setInterval(tick,1000);
setInterval(updatePMBanner,30000);
setInterval(function(){var et=etNow(),d=et.getDay(),m2=et.getHours()*60+et.getMinutes();if(d>0&&d<6&&m2>=240&&m2<960)go()},5*60*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&LAST_RUN&&Date.now()-LAST_RUN>5*60000)go()});
tick();updatePMBanner();updateBotStat();renderToday();go();
</script>
